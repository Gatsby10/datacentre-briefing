<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.summary | default: site.description | strip_html }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav><a href="{{ '/' | relative_url }}">Briefings</a><a href="{{ '/about/' | relative_url }}">About</a></nav>
  </div>
</header>
<main class="wrap">
{{ content }}
</main>
<footer class="wrap">
  <p>{{ site.title }} · {{ site.tagline }}</p>
  <p>Research is AI-assisted and reviewed by a human editor before publication. Every figure links to its source. Nothing here is investment advice.</p>
</footer>
</body>
</html>
